<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0f1e16;
    --panel:#132a1d;
    --panel-2:#1c3a27;
    --paper:#eef5ee;
    --line: rgba(255,255,255,0.09);
    --line-soft: rgba(15,31,22,0.09);
    --text-hi:#f1f7f2;
    --text-lo:#9db3a4;
    --accent:#33c47a;
    --accent-dim: rgba(51,196,122,0.16);
    --status-on:#2fb673;
    --status-on-bg: rgba(47,182,115,0.14);
    --status-risk:#c9962e;
    --status-risk-bg: rgba(201,150,46,0.14);
    --status-off:#c9503f;
    --status-off-bg: rgba(201,80,63,0.14);
    --priority-low:#5f7a68;
    --priority-low-bg: rgba(95,122,104,0.14);
    --priority-medium:#3a6ea5;
    --priority-medium-bg: rgba(58,110,165,0.14);
    --priority-high:#a0459e;
    --priority-high-bg: rgba(160,69,158,0.14);
    --folder-caps:#c9962e;
    --folder-caps-bg: rgba(201,150,46,0.14);
    --folder-films:#7a5cc0;
    --folder-films-bg: rgba(122,92,192,0.16);
    --folder-commercial:#2f9e9e;
    --folder-commercial-bg: rgba(47,158,158,0.14);
    font-family: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text-hi);}
  body{min-height:100vh;}
  ::selection{background:var(--accent-dim);}

  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:22px 14px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px;
    color:var(--text-hi); letter-spacing:0.2px; padding: 4px 10px 4px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 4px var(--accent-dim);}
  .brand-sub{ font-size:11px; color:var(--text-lo); padding:0 10px 20px; font-family:'JetBrains Mono', monospace; letter-spacing:0.3px;}

  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-lo);
    padding:14px 10px 6px; font-weight:600;
  }
  .tab-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; background:none; border:none; color:var(--text-lo);
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500;
    padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px;
    transition: background .12s, color .12s;
    position:relative;
  }
  .tab-btn:hover{ background: rgba(255,255,255,0.05); color:var(--text-hi); }
  .tab-btn.active{ background: var(--accent-dim); color:var(--text-hi); }
  .tab-btn.active::before{
    content:""; position:absolute; left:-14px; top:8px; bottom:8px; width:3px;
    background:var(--accent); border-radius:2px;
  }
  .tab-btn .stripe{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .tab-btn .label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .tab-btn .count{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-lo); }

  .add-project-btn{
    margin-top:6px; display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-radius:8px; border:1px dashed var(--line);
    color:var(--text-lo); font-size:12.5px; cursor:pointer; background:none;
    font-family:'Inter',sans-serif;
  }
  .add-project-btn:hover{ color:var(--accent); border-color:var(--accent); }

  .folder-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; background:none; border:none; color:var(--text-lo);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
    padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px;
    transition: background .12s, color .12s;
  }
  .folder-btn:hover{ background: rgba(255,255,255,0.05); color:var(--text-hi); }
  .folder-btn.active{ background: rgba(255,255,255,0.07); color:var(--text-hi); }
  .folder-btn .fdot{ width:8px; height:8px; border-radius:3px; flex-shrink:0; }
  .folder-btn .flabel{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .folder-btn .fcount{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-lo); }

  .tab-btn.has-folder{ border-left:3px solid transparent; padding-left:7px; }

  .sidebar-footer{ margin-top:auto; padding:14px 10px 4px; font-size:10.5px; color:var(--text-lo); font-family:'JetBrains Mono',monospace; border-top:1px solid var(--line); padding-top:14px; line-height:1.6;}

  /* ---------- Main ---------- */
  .main{ flex:1; background:var(--paper); color:var(--ink); min-height:100vh; }
  .main-inner{ max-width:1080px; margin:0 auto; padding:40px 44px 80px; }

  .page-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; gap:20px;}
  .page-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#5f7a68; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .page-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; margin:0; outline:none;}
  .page-title[contenteditable]:hover{ background: rgba(15,31,22,0.04); border-radius:4px;}
  .page-sub{ font-size:14px; color:#4c5c52; max-width:560px; margin-top:6px; outline:none; line-height:1.5;}

  /* Project header status row */
  .status-row{ display:flex; align-items:center; gap:14px; margin-top:14px; flex-wrap:wrap; }
  .status-block{ display:flex; align-items:center; gap:8px; }
  .status-block-label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:#5f7a68; }
  .status-toggle{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; padding:6px 14px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; border:none;
  }
  .status-toggle.on{ background:var(--status-on-bg); color:var(--status-on); }
  .status-toggle.risk{ background:var(--status-risk-bg); color:var(--status-risk); }
  .status-toggle.off{ background:var(--status-off-bg); color:var(--status-off); }

  .priority-toggle{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; padding:6px 14px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; border:none;
  }
  .priority-toggle.low{ background:var(--priority-low-bg); color:var(--priority-low); }
  .priority-toggle.medium{ background:var(--priority-medium-bg); color:var(--priority-medium); }
  .priority-toggle.high{ background:var(--priority-high-bg); color:var(--priority-high); }

  .folder-toggle{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; padding:6px 14px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; border:none;
  }
  .folder-toggle.caps{ background:var(--folder-caps-bg); color:var(--folder-caps); }
  .folder-toggle.films{ background:var(--folder-films-bg); color:var(--folder-films); }
  .folder-toggle.commercial{ background:var(--folder-commercial-bg); color:var(--folder-commercial); }

  .date-chip{
    display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line-soft);
    border-radius:20px; padding:5px 12px 5px 10px;
  }
  .date-chip .cal{ font-size:12px; }
  .date-chip input[type=date]{
    border:none; background:none; font-family:'JetBrains Mono',monospace; font-size:12px; color:#2b3c32;
    outline:none; cursor:pointer;
  }

  /* Summary grid */
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap:16px; }
  .p-card{
    background:#fff; border:1px solid var(--line-soft); border-radius:10px;
    padding:18px 18px 16px; cursor:pointer; transition: transform .12s, box-shadow .12s;
    position:relative; overflow:hidden;
  }
  .p-card:hover{ transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,31,22,0.08); }
  .p-card .edge{ position:absolute; left:0; top:0; bottom:0; width:4px; }
  .p-card h3{ font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0 0 6px; padding-left:6px;}
  .p-card p.desc{ font-size:12.5px; color:#657a6c; margin:0 0 14px; padding-left:6px; line-height:1.5; min-height:36px;}
  .p-card .row{ display:flex; justify-content:space-between; align-items:center; padding-left:6px; gap:8px;}
  .avatars{ display:flex; }
  .avatar{
    width:24px; height:24px; border-radius:50%; background:var(--panel-2); color:#fff;
    font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;
    border:2px solid #fff; margin-left:-7px; font-family:'JetBrains Mono',monospace;
  }
  .avatar:first-child{ margin-left:0; }
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600; padding:3px 9px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.4px; white-space:nowrap;
  }
  .badge.on{ background:var(--status-on-bg); color:var(--status-on); }
  .badge.risk{ background:var(--status-risk-bg); color:var(--status-risk); }
  .badge.off{ background:var(--status-off-bg); color:var(--status-off); }
  .card-meta{ padding-left:6px; margin-bottom:12px; display:flex; align-items:center; gap:6px; font-size:11.5px; color:#5f7a68; font-family:'JetBrains Mono',monospace;}
  .p-flag{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; padding:2px 8px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.4px; white-space:nowrap;
  }
  .p-flag.low{ background:var(--priority-low-bg); color:var(--priority-low); }
  .p-flag.medium{ background:var(--priority-medium-bg); color:var(--priority-medium); }
  .p-flag.high{ background:var(--priority-high-bg); color:var(--priority-high); }
  .p-flag.caps{ background:var(--folder-caps-bg); color:var(--folder-caps); }
  .p-flag.films{ background:var(--folder-films-bg); color:var(--folder-films); }
  .p-flag.commercial{ background:var(--folder-commercial-bg); color:var(--folder-commercial); }
  .meta-sep{ color:#c3d0c8; }

  /* Section blocks on project pages */
  .section{ background:#fff; border:1px solid var(--line-soft); border-radius:10px; padding:20px 22px; margin-bottom:16px;}
  .section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .section-title{ font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px; color:#2b3c32; display:flex; align-items:center; gap:8px;}
  .section-title .ico{ width:7px; height:7px; border-radius:2px; background:var(--accent); display:inline-block;}
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px){ .two-col{ grid-template-columns:1fr; } }

  .goal-list{ list-style:none; margin:0; padding:0; }
  .goal-list li{
    display:flex; align-items:flex-start; gap:9px; padding:8px 0; font-size:13.5px; line-height:1.5;
    border-bottom:1px solid var(--line-soft);
  }
  .goal-list li:last-child{ border-bottom:none; }
  .goal-list li .bullet{ width:5px; height:5px; margin-top:7px; border-radius:50%; background:var(--accent); flex-shrink:0;}
  .goal-text{ flex:1; outline:none; }
  .goal-date{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:#4c5c52; background:#f1f6f2;
    border:1px solid var(--line-soft); border-radius:6px; padding:3px 6px; outline:none; flex-shrink:0;
  }
  .rm-btn{ opacity:0; cursor:pointer; color:#b9c6bd; font-size:15px; line-height:1; padding:2px 4px; border-radius:4px; flex-shrink:0;}
  .goal-list li:hover .rm-btn, .team-row:hover .rm-btn{ opacity:1; }
  .rm-btn:hover{ color:var(--status-off); background:var(--status-off-bg); }
  .add-line{ font-size:12.5px; color:#5f7a68; cursor:pointer; padding:8px 0 2px; display:flex; align-items:center; gap:6px; }
  .add-line:hover{ color:var(--accent); }

  .team-row{ display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line-soft); }
  .team-row:last-of-type{ border-bottom:none; }
  .avatar-lg{ width:30px; height:30px; border-radius:50%; background:var(--panel-2); color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; flex-shrink:0; margin-top:2px;}
  .team-name{ font-weight:600; font-size:13.5px; width:120px; flex-shrink:0; outline:none; padding-top:5px;}
  .team-role{ font-size:11.5px; color:#5f7a68; width:100px; flex-shrink:0; outline:none; font-family:'JetBrains Mono',monospace; padding-top:6px;}
  .team-working{ flex:1; font-size:13px; color:#2b3c32; outline:none; }

  /* Task checklist per person */
  .task-list{ list-style:none; margin:0; padding:0; }
  .task-row{ display:flex; align-items:flex-start; gap:8px; padding:3px 0; }
  .task-check{ width:14px; height:14px; margin-top:4px; cursor:pointer; accent-color:var(--accent); flex-shrink:0; }
  .task-text{ flex:1; font-size:13px; color:#2b3c32; outline:none; padding:2px 0; line-height:1.4; }
  .task-text.done{ text-decoration:line-through; color:#93a599; }
  .task-rm{ opacity:0; cursor:pointer; color:#b9c6bd; font-size:14px; line-height:1.4; padding:2px 4px; border-radius:4px; flex-shrink:0; }
  .task-row:hover .task-rm{ opacity:1; }
  .task-rm:hover{ color:var(--status-off); background:var(--status-off-bg); }
  .task-date{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#4c5c52; background:#f1f6f2;
    border:1px solid var(--line-soft); border-radius:6px; padding:3px 6px; outline:none; flex-shrink:0;
    margin-top:1px;
  }
  .task-date.overdue{ color:var(--status-off); background:var(--status-off-bg); border-color:transparent; }

  /* Risk list */
  .risk-list{ list-style:none; margin:0; padding:0; }
  .risk-row{ display:flex; align-items:flex-start; gap:9px; padding:8px 0; border-bottom:1px solid var(--line-soft); }
  .risk-row:last-child{ border-bottom:none; }
  .risk-text{ flex:1; font-size:13.5px; line-height:1.5; outline:none; padding-top:2px; }
  .risk-sev{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; padding:4px 10px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; border:none; flex-shrink:0;
  }
  .risk-sev.low{ background:var(--status-on-bg); color:var(--status-on); }
  .risk-sev.med{ background:var(--status-risk-bg); color:var(--status-risk); }
  .risk-sev.high{ background:var(--status-off-bg); color:var(--status-off); }
  .task-add{ font-size:11.5px; color:#8a9b90; cursor:pointer; padding:4px 0 0; }
  .task-add:hover{ color:var(--accent); }

  [contenteditable]:focus{ background: rgba(51,196,122,0.10); border-radius:4px; }
  [contenteditable]:empty:before{ content: attr(data-ph); color:#a9b8ae; }

  .danger-zone{ margin-top:30px; padding-top:16px; border-top:1px solid var(--line-soft); }
  .del-project{ font-size:12px; color:#b9c6bd; cursor:pointer; }
  .del-project:hover{ color:var(--status-off); }

  /* People tab */
  .people-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
  .person-card{ background:#fff; border:1px solid var(--line-soft); border-radius:10px; padding:18px; }
  .person-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .person-head .avatar-lg{ width:34px; height:34px; }
  .person-head .pname{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; }
  .person-assign{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:12.5px; }
  .person-assign:last-child{ border-bottom:none; }
  .person-assign{ display:block; }
  .person-assign .pj{ font-weight:600; color:#2b3c32; display:block; margin-bottom:4px; }
  .person-assign .wk{ color:#657a6c; }
  .person-task{ font-size:12.5px; padding:2px 0; }
  .person-task.done{ text-decoration:line-through; color:#a9b8ae; }
  .person-task.muted{ color:#a9b8ae; }
  .person-task-date{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#8a9b90; }

  .save-pill{
    position:fixed; bottom:18px; right:18px; background:var(--panel); color:var(--text-lo);
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:8px 14px; border-radius:20px;
    border:1px solid var(--line); opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .save-pill.show{ opacity:1; }
  .save-pill .accent-dot{ color:var(--accent); }

  /* ---------- Login ---------- */
  .login-screen{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .login-box{
    width:100%; max-width:320px; padding:0 20px;
  }
  .login-brand{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px;
    color:var(--text-hi); display:flex; align-items:center; gap:8px; margin-bottom:28px;
  }
  .login-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 4px var(--accent-dim);}
  .login-field{ margin-bottom:12px; }
  .login-field label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.6px; color:var(--text-lo); margin-bottom:6px;
  }
  .login-field input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text-hi);
    font-family:'Inter',sans-serif; font-size:13.5px; padding:10px 12px; border-radius:8px; outline:none;
  }
  .login-field input:focus{ border-color:var(--accent); }
  .login-submit{
    width:100%; background:var(--accent); color:#0f1e16; border:none; font-family:'Inter',sans-serif;
    font-weight:600; font-size:13.5px; padding:10px 12px; border-radius:8px; cursor:pointer; margin-top:6px;
  }
  .login-submit:disabled{ opacity:0.6; cursor:default; }
  .login-error{
    color:var(--status-off); font-size:12px; font-family:'Inter',sans-serif; margin-top:10px; min-height:16px;
  }
  .logout-btn{
    position:fixed; top:16px; right:16px; z-index:50; background:none; border:1px solid var(--line-soft);
    color:#5f7a68; font-family:'JetBrains Mono',monospace; font-size:11px; padding:6px 12px; border-radius:20px;
    cursor:pointer;
  }
  .logout-btn:hover{ border-color:#5f7a68; }
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-brand"><span class="dot"></span>Team Board</div>
    <form id="loginForm">
      <div class="login-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-submit" id="loginSubmit">Log in</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>
<button class="logout-btn" id="logoutBtn" style="display:none;">Log out</button>
<div class="app" id="app"></div>
<div class="save-pill" id="savePill"><span class="accent-dot">●</span> saved</div>

<script>
let data = null;
let activeTab = 'summary';
let activeFolder = 'all';
let saveTimer = null;

const seed = {
  projects: [
    {
      id: 'p1',
      name: 'Project Atlas',
      summary: 'Rebuild of the core platform data layer.',
      status: 'on',
      keyDate: '',
      priority: 'high',
      folder: 'commercial',
      techGoals: [
        { text: 'Migrate to event-driven architecture', date: '' },
        { text: 'Cut p95 latency below 200ms', date: '' }
      ],
      commercialGoals: [
        { text: 'Unblock enterprise tier launch', date: '' },
        { text: 'Reduce infra cost by 15%', date: '' }
      ],
      risks: [
        { text: 'Event bus migration could slip past the enterprise launch date', severity: 'high' },
        { text: 'Limited backend coverage if Priya is pulled onto Nova', severity: 'med' }
      ],
      team: [
        { name: 'Sam Iyer', role: 'Eng Lead', tasks: [ { text: 'Event bus migration', done: false, date: '2026-08-07' }, { text: 'Design service boundaries doc', done: true, date: '' } ] },
        { name: 'Priya Nath', role: 'Backend', tasks: [ { text: 'Latency profiling', done: false, date: '' } ] }
      ]
    },
    {
      id: 'p2',
      name: 'Project Nova',
      summary: 'New self-serve onboarding flow.',
      status: 'risk',

const PERSON_PALETTE = [
  '#2f8f5b', '#3a6ea5', '#b5622f', '#7a5cc0', '#c14f7a',
  '#2f9e9e', '#a68a2f', '#5c7a2f', '#c0507f', '#4f6fc1',
  '#a04f9e', '#3f9e6f', '#c17c3f', '#4f8fc1', '#8f4fc1'

function personColor(name){
  const key = (name||'').trim().toLowerCase() || '?';
  let hash = 0;
  for(let i=0;i<key.length;i++){ hash = (hash * 31 + key.charCodeAt(i)) >>> 0; }
  return PERSON_PALETTE[hash % PERSON_PALETTE.length];
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { day:'numeric', month:'short' });
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

async function loadData(){
  try{
    const { data: row, error } = await sb.from('boards').select('data').eq('id', BOARD_ROW_ID).single();
    if(error) throw error;
    data = (row && row.data && Object.keys(row.data).length) ? row.data : JSON.parse(JSON.stringify(seed));
  }catch(e){
    console.error('load failed', e);
    data = JSON.parse(JSON.stringify(seed));
  }
  data.projects.forEach(p=>{
    if(!p.status) p.status = 'on';
    if(p.keyDate === undefined) p.keyDate = '';
    if(!p.priority) p.priority = 'medium';
    if(!p.folder || !FOLDER_ORDER.includes(p.folder)) p.folder = 'caps';
    if(!Array.isArray(p.risks)) p.risks = [];
    p.team.forEach(t=>{
      if(!Array.isArray(t.tasks)){
        t.tasks = t.working ? [{ text: t.working, done: false, date: '' }] : [];
      }
      t.tasks.forEach(task=>{ if(task.date === undefined) task.date = ''; });
    });
  });
  render();
  subscribeToRemoteChanges();
}

async function persist(){
  if(applyingRemoteUpdate) return; // don't write back a change we just received from someone else
  const pill = document.getElementById('savePill');
  try{
    const { error } = await sb.from('boards').update({ data, updated_at: new Date().toISOString() }).eq('id', BOARD_ROW_ID);
    if(error) throw error;
    pill.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=> pill.classList.remove('show'), 1200);
  }catch(e){ console.error('save failed', e); }
}
function scheduleSave(){ clearTimeout(scheduleSave._t); scheduleSave._t = setTimeout(persist, 500); }

// Live sync: when a teammate saves, pull their change in and re-render.
let remoteChannel = null;
function subscribeToRemoteChanges(){
  if(remoteChannel) return;
  remoteChannel = sb.channel('boards-changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'boards', filter: `id=eq.${BOARD_ROW_ID}` }, payload => {
      applyingRemoteUpdate = true;
      data = payload.new.data;
      render();
      applyingRemoteUpdate = false;
    })
    .subscribe();
}

function normalizeName(name){
  return (name || '')
    .replace(/\u00a0/g, ' ')   // non-breaking spaces from contenteditable
    .replace(/\s+/g, ' ')      // collapse repeated/newline whitespace
    .trim();
}

function getAllPeople(){
  const map = {};
  data.projects.forEach(p=>{
    p.team.forEach(t=>{
      const cleanName = normalizeName(t.name);
      if(!cleanName) return; // skip blank/whitespace-only entries
      // group case-insensitively, but keep the first-seen casing for display
      const key = Object.keys(map).find(k => k.toLowerCase() === cleanName.toLowerCase()) || cleanName;
      if(!map[key]) map[key] = [];
      map[key].push({ project: p.name, tasks: t.tasks||[], projectId: p.id });
    });
  });
  return map;
}

    li.innerHTML = `
      <input type="checkbox" class="task-check" ${task.done ? 'checked' : ''}>
      <span class="task-text${task.done ? ' done' : ''}" contenteditable="true" data-ph="What are they working on...">${escapeHtml(task.text)}</span>
      <input type="date" class="task-date${isOverdue ? ' overdue' : ''}" value="${escapeHtml(task.date||'')}">
      <span class="task-rm">×</span>
    `;
    li.querySelector('.task-check').addEventListener('change', e=>{
      task.done = e.target.checked;
      li.querySelector('.task-text').classList.toggle('done', task.done);
      li.querySelector('.task-date').classList.toggle('overdue', !!task.date && !task.done && task.date < todayStr());
      scheduleSave();
    });
    li.querySelector('.task-text').addEventListener('input', e=>{ task.text = e.target.textContent; scheduleSave(); });
    li.querySelector('.task-date').addEventListener('change', e=>{
      task.date = e.target.value;
      e.target.classList.toggle('overdue', !!task.date && !task.done && task.date < todayStr());
      scheduleSave();
    });
    li.querySelector('.task-rm').onclick = ()=>{ t.tasks.splice(tIdx,1); render(); scheduleSave(); };
    ul.appendChild(li);
  });
  container.appendChild(ul);
  const add = document.createElement('div');
  add.className = 'task-add';
  add.textContent = '+ add task';
  add.onclick = ()=>{ t.tasks.push({ text:'', done:false, date:'' }); render(); scheduleSave(); };
  container.appendChild(add);
  return container;
}

function renderSidebarOnly(){
  const app = document.getElementById('app');
  const old = app.querySelector('.sidebar');
  const fresh = renderSidebar();
  app.replaceChild(fresh, old);
}

function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

</script>
</body>
</html>
