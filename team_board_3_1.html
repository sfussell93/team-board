<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0f1e16;
    --panel:#132a1d;
    --panel-2:#1c3a27;
    --paper:#eef5ee;
    --line: rgba(255,255,255,0.09);
    --line-soft: rgba(15,31,22,0.09);
    --text-hi:#f1f7f2;
    --text-lo:#9db3a4;
    --accent:#33c47a;
    --accent-dim: rgba(51,196,122,0.16);
    --status-on:#2fb673;
    --status-on-bg: rgba(47,182,115,0.14);
    --status-risk:#c9962e;
    --status-risk-bg: rgba(201,150,46,0.14);
    --status-off:#c9503f;
    --status-off-bg: rgba(201,80,63,0.14);
    --priority-low:#5f7a68;
    --priority-low-bg: rgba(95,122,104,0.14);
    --priority-medium:#3a6ea5;
    --priority-medium-bg: rgba(58,110,165,0.14);
    --priority-high:#a0459e;
    --priority-high-bg: rgba(160,69,158,0.14);
    --folder-caps:#c9962e;
    --folder-caps-bg: rgba(201,150,46,0.14);
    --folder-films:#7a5cc0;
    --folder-films-bg: rgba(122,92,192,0.16);
    --folder-commercial:#2f9e9e;
    --folder-commercial-bg: rgba(47,158,158,0.14);
    font-family: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text-hi);}
  body{min-height:100vh;}
  ::selection{background:var(--accent-dim);}

  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:22px 14px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px;
    color:var(--text-hi); letter-spacing:0.2px; padding: 4px 10px 4px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 4px var(--accent-dim);}
  .brand-sub{ font-size:11px; color:var(--text-lo); padding:0 10px 20px; font-family:'JetBrains Mono', monospace; letter-spacing:0.3px;}

  .nav-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-lo);
    padding:14px 10px 6px; font-weight:600;
  }
  .tab-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; background:none; border:none; color:var(--text-lo);
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500;
    padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px;
    transition: background .12s, color .12s;
    position:relative;
  }
  .tab-btn:hover{ background: rgba(255,255,255,0.05); color:var(--text-hi); }
  .tab-btn.active{ background: var(--accent-dim); color:var(--text-hi); }
  .tab-btn.active::before{
    content:""; position:absolute; left:-14px; top:8px; bottom:8px; width:3px;
    background:var(--accent); border-radius:2px;
  }
  .tab-btn .stripe{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .tab-btn .label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .tab-btn .count{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-lo); }

  .add-project-btn{
    margin-top:6px; display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-radius:8px; border:1px dashed var(--line);
    color:var(--text-lo); font-size:12.5px; cursor:pointer; background:none;
    font-family:'Inter',sans-serif;
  }
  .add-project-btn:hover{ color:var(--accent); border-color:var(--accent); }

  .folder-btn{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; background:none; border:none; color:var(--text-lo);
    font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
    padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px;
    transition: background .12s, color .12s;
  }
  .folder-btn:hover{ background: rgba(255,255,255,0.05); color:var(--text-hi); }
  .folder-btn.active{ background: rgba(255,255,255,0.07); color:var(--text-hi); }
  .folder-btn .fdot{ width:8px; height:8px; border-radius:3px; flex-shrink:0; }
  .folder-btn .flabel{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; outline:none; }
  .folder-btn .flabel[contenteditable="true"]{ overflow:visible; white-space:normal; cursor:text; }
  .folder-btn .fcount{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-lo); }
  .folder-edit-row{ display:flex; align-items:center; gap:10px; width:100%; padding:7px 10px 7px 22px; border-radius:8px; margin-bottom:1px; }
  .folder-edit-row:hover{ background: rgba(255,255,255,0.05); }
  .folder-edit-row .fdot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .topic-edit-row{
    display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:8px; margin-top:8px;
    margin-bottom:2px; cursor:pointer; font-weight:600;
  }
  .topic-edit-row:first-of-type{ margin-top:0; }
  .topic-edit-row:hover{ background: rgba(255,255,255,0.05); }
  .topic-edit-row.active{ background: rgba(255,255,255,0.07); }
  .topic-edit-row .fdot{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
  .add-subfolder-btn{
    width:100%; text-align:left; background:none; border:none; color:var(--text-lo);
    font-family:'Inter',sans-serif; font-size:11.5px; padding:5px 10px 5px 22px; border-radius:8px; cursor:pointer; margin-bottom:4px;
  }
  .add-subfolder-btn:hover{ background: rgba(255,255,255,0.05); color:var(--text-hi); }
  .folder-icon-btn{
    opacity:0; flex-shrink:0; cursor:pointer; color:var(--text-lo); font-size:12px; padding:2px 4px; border-radius:4px;
  }
  .folder-edit-row:hover .folder-icon-btn, .topic-edit-row:hover .folder-icon-btn{ opacity:1; }
  .folder-icon-btn:hover{ color:var(--text-hi); background:rgba(255,255,255,0.08); }
  .folder-icon-btn.del:hover{ color:#e37c7c; }
  .add-folder-btn{
    width:100%; text-align:left; background:none; border:none; color:var(--text-lo);
    font-family:'Inter',sans-serif; font-size:12.5px; padding:7px 10px; border-radius:8px; cursor:pointer; margin-bottom:6px; margin-top:6px;
  }
  .add-folder-btn:hover{ background: rgba(255,255,255,0.05); color:var(--text-hi); }

  /* ---------- Meeting agenda ---------- */
  .agenda-folder-picker{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .agenda-folder-pill{
    display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line-soft);
    color:#4c5c52; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500; padding:6px 12px;
    border-radius:20px; cursor:pointer;
  }
  .agenda-folder-pill .fdot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .agenda-folder-pill.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .agenda-copy-btn{
    margin-left:auto; background:var(--accent); color:#0f1e16; border:none; font-family:'Inter',sans-serif;
    font-weight:600; font-size:12.5px; padding:8px 14px; border-radius:20px; cursor:pointer;
  }
  .agenda-focus-picker{ display:flex; align-items:center; gap:6px; margin-bottom:24px; }
  .agenda-focus-pill{
    background:none; border:1px solid var(--line-soft); color:#5f7a68; font-family:'JetBrains Mono',monospace;
    font-size:11px; text-transform:uppercase; letter-spacing:0.5px; padding:6px 12px; border-radius:16px; cursor:pointer;
  }
  .agenda-focus-pill.active{ background:var(--accent-dim); border-color:transparent; color:var(--accent); font-weight:600; }
  .agenda-cross-box{
    background:#f6f4ee; border:1px dashed var(--line-soft); border-radius:10px; padding:14px 16px; margin-bottom:28px;
  }
  .agenda-cross-title{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:#8a7a4f; margin-bottom:8px;
  }
  .agenda-cross-box .agenda-item-row{ border-bottom-color:rgba(0,0,0,0.06); }
  .agenda-section{ margin-bottom:28px; }
  .agenda-section-title{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--ink);
    margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line-soft);
  }
  .agenda-empty{ font-size:13px; color:#8a9b90; padding:4px 0; }
  .agenda-rank-list{ display:flex; flex-direction:column; gap:2px; }
  .agenda-rank-item{
    display:flex; align-items:center; gap:10px; padding:8px 4px; border-radius:8px; cursor:pointer;
  }
  .agenda-rank-item:hover{ background:#f1f6f2; }
  .agenda-rank-num{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:#8a9b90; width:16px; flex-shrink:0;
  }
  .agenda-rank-name{ font-size:13.5px; font-weight:600; flex:1; }
  .agenda-rank-meta{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#5f7a68; white-space:nowrap; }
  .agenda-item-list{ display:flex; flex-direction:column; gap:1px; }
  .agenda-item-row{
    display:flex; justify-content:space-between; align-items:center; gap:14px; padding:7px 4px;
    border-bottom:1px solid var(--line-soft); font-size:13px;
  }
  .agenda-item-row:last-child{ border-bottom:none; }
  .agenda-item-main{ color:#2b3c32; }
  .agenda-item-meta{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#8a9b90; white-space:nowrap; flex-shrink:0; }
  .agenda-overdue-tag{ color:var(--status-off); }
  .agenda-cap-list{ display:flex; flex-direction:column; gap:8px; }
  .agenda-cap-row{ display:flex; align-items:center; gap:10px; }
  .agenda-cap-name{ font-size:13px; font-weight:600; flex:1; }
  .agenda-cap-stat{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#5f7a68; background:#f1f6f2;
    border-radius:10px; padding:3px 9px;
  }
  .agenda-recur-tag{ color:var(--accent); }

  /* ---------- Goals page ---------- */
  .goals-table-section{ margin-bottom:36px; }
  .goals-table-title{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:var(--ink);
    margin-bottom:16px; padding-bottom:10px; border-bottom:2px solid var(--ink);
  }
  .goals-filter-group{ margin-bottom:20px; }
  .goals-filter-group:last-child{ margin-bottom:0; }
  .goals-filter-heading{
    display:flex; align-items:center; gap:7px; font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:0.6px; color:#5f7a68; margin-bottom:6px;
  }
  .goals-filter-heading .fdot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .goals-table{ display:flex; flex-direction:column; }
  .goals-table-row{
    display:flex; align-items:flex-start; gap:14px; padding:9px 4px; border-bottom:1px solid var(--line-soft);
    cursor:pointer; font-size:13.5px;
  }
  .goals-table-row:hover{ background:#f6f4ee; }
  .goals-empty{ font-size:13px; color:#8a9b90; padding:6px 0 0; }
  .goals-page-date{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#5f7a68; width:64px; flex-shrink:0; padding-top:1px;
  }
  .goals-page-date.overdue{ color:var(--status-off); font-weight:600; }
  .goals-page-text{ flex:1; color:#2b3c32; }
  .goals-page-link{ display:block; font-size:11.5px; color:#8a9b90; margin-top:2px; }
  .goals-page-status{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.4px; padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle;
  }
  .goals-page-status.not_started{ background:#eef0ee; color:#8a9b90; }
  .goals-page-status.in_progress{ background:var(--status-risk-bg); color:var(--status-risk); }
  .goals-page-status.done{ background:var(--status-on-bg); color:var(--status-on); }
  .goals-page-blocked{
    display:inline-block; font-size:11px; font-weight:500; text-transform:none;
    letter-spacing:normal; color:#8a6a2f; background:#faf1de; padding:2px 8px; border-radius:10px;
    margin-left:6px; vertical-align:middle;
  }
  .goals-page-project{ font-size:12px; font-weight:600; color:#5f7a68; flex-shrink:0; }

  /* ---------- Timeline / Gantt ---------- */
  .timeline-scroll{
    overflow-x:auto; margin-bottom:16px; border:1px solid var(--line-soft); border-radius:10px; padding:12px 0;
    transform:scaleY(-1);
  }
  .timeline-scroll-inner{ position:relative; transform:scaleY(-1); }
  .timeline-axis{
    position:relative; height:24px; border-bottom:1px solid var(--line-soft); margin-bottom:4px;
  }
  .timeline-month-tick{
    position:absolute; top:0; transform:translateX(-2px); font-family:'JetBrains Mono',monospace; font-size:10.5px;
    color:#8a9b90; border-left:1px solid var(--line-soft); padding-left:5px; height:100%;
  }
  .timeline-body{ display:flex; flex-direction:column; }
  .timeline-filter-heading{
    position:sticky; left:0; display:inline-flex; align-items:center; gap:7px; font-family:'JetBrains Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:0.6px; color:#5f7a68; margin:16px 0 4px; background:var(--paper); padding-right:10px;
  }
  .timeline-filter-heading .fdot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .timeline-project-heading{
    position:sticky; left:0; display:inline-block; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px;
    color:var(--ink); cursor:pointer; padding:8px 10px 4px 4px; background:var(--paper);
  }
  .timeline-project-heading:hover{ color:var(--accent); }
  .timeline-row{ display:flex; align-items:center; min-height:30px; border-bottom:1px solid var(--line-soft); }
  .timeline-row-label{
    position:sticky; left:0; flex-shrink:0; font-size:12px; color:#4c5c52; cursor:pointer; background:var(--paper);
    padding-right:12px; padding-left:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; z-index:2;
  }
  .timeline-row-label:hover{ color:var(--accent); }
  .timeline-row-track{ position:relative; height:30px; flex-shrink:0; }
  .timeline-no-dates{
    position:absolute; left:0; top:50%; transform:translateY(-50%); font-size:11.5px; color:#b9c6bd; font-style:italic;
  }
  .timeline-dep-bar{
    position:absolute; top:50%; transform:translateY(-50%); height:4px; border-radius:3px;
    background:repeating-linear-gradient(90deg, #d9a94a, #d9a94a 4px, transparent 4px, transparent 8px); opacity:0.6;
  }
  .timeline-marker{
    position:absolute; top:50%; width:10px; height:10px; border-radius:50%; transform:translate(-50%,-50%);
    cursor:pointer; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,0.08);
  }
  .timeline-marker.keydate{ background:var(--ink); width:11px; height:11px; }
  .timeline-marker.tech{ background:var(--priority-medium); }
  .timeline-marker.commercial{ background:var(--status-on); }
  .timeline-marker.task{ background:#9fb0a4; width:8px; height:8px; }
  .timeline-marker.overdue{ background:var(--status-off); }
  .timeline-marker.blocked{ box-shadow:0 0 0 2px #fff, 0 0 0 4px #d9a94a; opacity:0.7; }
  .timeline-today-line{
    position:absolute; top:0; bottom:0; width:2px; background:var(--accent); pointer-events:none;
  }
  .timeline-today-label{
    position:absolute; top:-22px; left:50%; transform:translateX(-50%); background:var(--accent); color:#0f1e16;
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px;
    white-space:nowrap;
  }
  .timeline-legend{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap; font-size:12px; color:#5f7a68;
    padding-top:14px; margin-top:8px; border-top:1px solid var(--line-soft);
  }
  .timeline-legend span{ display:flex; align-items:center; gap:6px; }
  .timeline-legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .timeline-legend-dot.keydate{ background:var(--ink); }
  .timeline-legend-dot.tech{ background:var(--priority-medium); }
  .timeline-legend-dot.commercial{ background:var(--status-on); }
  .timeline-legend-dot.task{ background:#9fb0a4; }
  .timeline-legend-dot.overdue{ background:var(--status-off); }
  .timeline-legend-dash{
    width:16px; height:4px; border-radius:3px; flex-shrink:0;
    background:repeating-linear-gradient(90deg, #d9a94a, #d9a94a 4px, transparent 4px, transparent 8px); opacity:0.8;
  }

  .tab-btn.has-folder{ border-left:3px solid transparent; padding-left:7px; }

  .sidebar-footer{ margin-top:auto; padding:14px 10px 4px; font-size:10.5px; color:var(--text-lo); font-family:'JetBrains Mono',monospace; border-top:1px solid var(--line); padding-top:14px; line-height:1.6;}

  /* ---------- Main ---------- */
  .main{ flex:1; background:var(--paper); color:var(--ink); min-height:100vh; }
  .main-inner{ max-width:1080px; margin:0 auto; padding:40px 44px 80px; }

  .page-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; gap:20px;}
  .page-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#5f7a68; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .page-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; margin:0; outline:none;}
  .page-title[contenteditable]:hover{ background: rgba(15,31,22,0.04); border-radius:4px;}
  .page-sub{ font-size:14px; color:#4c5c52; max-width:560px; margin-top:6px; outline:none; line-height:1.5;}

  /* Project header status row */
  .status-row{ display:flex; align-items:center; gap:14px; margin-top:14px; flex-wrap:wrap; }
  .status-block{ display:flex; align-items:center; gap:8px; }
  .status-block-label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:#5f7a68; }
  .status-toggle{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; padding:6px 14px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; border:none;
  }
  .status-toggle.on{ background:var(--status-on-bg); color:var(--status-on); }
  .status-toggle.risk{ background:var(--status-risk-bg); color:var(--status-risk); }
  .status-toggle.off{ background:var(--status-off-bg); color:var(--status-off); }

  .priority-toggle{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; padding:6px 14px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; border:none;
  }
  .priority-toggle.low{ background:var(--priority-low-bg); color:var(--priority-low); }
  .priority-toggle.medium{ background:var(--priority-medium-bg); color:var(--priority-medium); }
  .priority-toggle.high{ background:var(--priority-high-bg); color:var(--priority-high); }

  .folder-toggle{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; padding:6px 14px;
    border-radius:20px; text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; border:none;
  }

  .date-chip{
    display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line-soft);
    border-radius:20px; padding:5px 12px 5px 10px;
  }
  .date-chip .cal{ font-size:12px; }
  .date-chip input[type=date]{
    border:none; background:none; font-family:'JetBrains Mono',monospace; font-size:12px; color:#2b3c32;
    outline:none; cursor:pointer;
  }

  /* Summary grid */
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap:16px; }
  .p-card{
    background:#fff; border:1px solid var(--line-soft); border-radius:10px;
    padding:18px 18px 16px; cursor:pointer; transition: transform .12s, box-shadow .12s;
    position:relative; overflow:hidden;
  }
  .p-card:hover{ transform: translateY(-2px); box-shadow: 0 8px 24px rgba(15,31,22,0.08); }
  .p-card .edge{ position:absolute; left:0; top:0; bottom:0; width:4px; }
  .p-card h3{ font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0 0 6px; padding-left:6px;}
  .p-card p.desc{ font-size:12.5px; color:#657a6c; margin:0 0 14px; padding-left:6px; line-height:1.5; min-height:36px;}
  .p-card .row{ display:flex; justify-content:flex-end; align-items:center; padding-left:6px; gap:8px;}
  .avatars{ display:flex; }
  .avatar{
    width:24px; height:24px; border-radius:50%; background:var(--panel-2); color:#fff;

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function colorForId(list, id){
  const idx = list.findIndex(x=>x.id===id);
  return FOLDER_PALETTE[(idx>=0?idx:0) % FOLDER_PALETTE.length];
}
function folderColor(id){ return colorForId(data.folders, id); }
function folderColorBg(id){ return hexToRgba(folderColor(id), 0.14); }
function folderLabel(id){
  const f = data.folders.find(f=>f.id===id);
  return f ? f.label : (FOLDER_LABELS_LEGACY[id] || id);
}
function topicColor(id){ return colorForId(data.topics, id); }
function topicColorBg(id){ return hexToRgba(topicColor(id), 0.14); }
function topicLabel(id){
  const t = data.topics.find(t=>t.id===id);
  return t ? t.label : id;
}
function topicForFolder(folderId){
  const f = data.folders.find(f=>f.id===folderId);
  if(!f) return null;
  return data.topics.find(t=>t.id===f.topicId) || null;
}
function topicForProject(p){ return topicForFolder(p.folder); }
function projectsInTopic(topicId){
  return data.projects.filter(p=>{ const t = topicForProject(p); return t && t.id === topicId; });

}

function goalAppliesToProject(projectIds, projectId){

// All goals (tech + commercial) in a topic, as one combined list — used for "depends on" pickers.
function allTopicGoals(topic){
  if(!topic) return [];
  return [...(topic.techGoals||[]), ...(topic.commercialGoals||[])];
}
function goalById(topic, id){
  return allTopicGoals(topic).find(g=>g.id===id) || null;
}
function dependencyGoals(goal, topic){
  if(!Array.isArray(goal.dependsOnIds)) return [];
  return goal.dependsOnIds.map(id=>goalById(topic, id)).filter(Boolean);
}
function unfinishedDependencies(goal, topic){
  return dependencyGoals(goal, topic).filter(dep=>dep.status !== 'done');
}
// A goal is blocked if ANY of its dependencies aren't done yet.
function isGoalBlocked(goal, topic){
  return unfinishedDependencies(goal, topic).length > 0;
}
// Resolve the current sidebar selection (activeFolder) into the list of projects it should show.
// activeFolder can be: 'all', 'topic:<id>' (every subfolder under that topic), or a plain subfolder id.
function projectsForActiveFilter(){
  if(activeFolder === 'all') return data.projects;
  if(typeof activeFolder === 'string' && activeFolder.startsWith('topic:')){
    const topicId = activeFolder.slice(6);
    const folderIds = data.folders.filter(f=>f.topicId===topicId).map(f=>f.id);
    return data.projects.filter(p=>folderIds.includes(p.folder));
  }
  return data.projects.filter(p=>p.folder===activeFolder);
}

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }

const PERSON_PALETTE = [
  '#2f8f5b', '#3a6ea5', '#b5622f', '#7a5cc0', '#c14f7a',
  '#2f9e9e', '#a68a2f', '#5c7a2f', '#c0507f', '#4f6fc1',
  '#a04f9e', '#3f9e6f', '#c17c3f', '#4f8fc1', '#8f4fc1'
];
function personColor(name){
  const key = (name||'').trim().toLowerCase() || '?';
  let hash = 0;
  for(let i=0;i<key.length;i++){ hash = (hash * 31 + key.charCodeAt(i)) >>> 0; }
  return PERSON_PALETTE[hash % PERSON_PALETTE.length];
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { day:'numeric', month:'short' });
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, n){
  const base = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  base.setDate(base.getDate() + n);
  return base.getFullYear() + '-' + String(base.getMonth()+1).padStart(2,'0') + '-' + String(base.getDate()).padStart(2,'0');
}
function isWithinNextDays(dateStr, days){
  if(!dateStr) return false;
  const today = todayStr();
  return dateStr >= today && dateStr <= addDays(today, days);
}
function isWithinLastDays(dateStr, days){
  if(!dateStr) return false;
  const today = todayStr();
  return dateStr <= today && dateStr >= addDays(today, -days);
}
function daysBetween(dateStr, fromStr){
  const a = new Date(dateStr + 'T00:00:00'), b = new Date(fromStr + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

async function loadData(){
  try{

  }

    data.folders = [
      { id: 'caps', label: 'Caps' },
      { id: 'films', label: 'Films' },
      { id: 'commercial', label: 'Commercial' }
    ];
  }
  let justMigratedTopics = false;
  if(!Array.isArray(data.topics)){
    justMigratedTopics = true;
    // First time seeing this data shape: build topics from existing folder names,
    // and merge each project's own goals into its topic's shared goal list (by text, deduped).
    data.topics = [];
    const topicKeyToId = {};
    data.folders.forEach(f=>{
      const lower = (f.label || '').toLowerCase();
      const key = lower.includes('film') ? 'films' : (lower.includes('cap') || lower.includes('coat')) ? 'caps' : 'general';
      if(!topicKeyToId[key]){
        const label = key === 'films' ? 'Films' : key === 'caps' ? 'Caps' : 'General';
        const t = { id: uid('topic'), label, techGoals: [], commercialGoals: [] };
        data.topics.push(t);
        topicKeyToId[key] = t.id;
      }
      f.topicId = topicKeyToId[key];
    });
    if(data.topics.length === 0){
      const t = { id: uid('topic'), label: 'General', techGoals: [], commercialGoals: [] };
      data.topics.push(t);
    }
    data.projects.forEach(p=>{
      const folder = data.folders.find(f=>f.id===p.folder);
      const topic = folder ? data.topics.find(t=>t.id===folder.topicId) : data.topics[0];
      if(!topic) return;
      (p.techGoals||[]).forEach(g=>{
        if(g.text && !topic.techGoals.some(x=>x.text===g.text)) topic.techGoals.push({ text: g.text, date: g.date || '' });
      });
      (p.commercialGoals||[]).forEach(g=>{
        if(g.text && !topic.commercialGoals.some(x=>x.text===g.text)) topic.commercialGoals.push({ text: g.text, date: g.date || '' });
      });
    });
  }
  // Make sure every folder points at a real topic (covers folders added after migration too)
  data.folders.forEach(f=>{
    if(!f.topicId || !data.topics.some(t=>t.id===f.topicId)){
      f.topicId = data.topics[0].id;
    }
  });
  data.topics.forEach(t=>{
    (t.techGoals||[]).forEach(g=>{
      if(!g.id) g.id = uid('g');
      if(g.linksTo === undefined) g.linksTo = '';
      if(!Array.isArray(g.projectIds)) g.projectIds = [];
      if(!g.status) g.status = 'not_started';
      if(!Array.isArray(g.dependsOnIds)) g.dependsOnIds = g.dependsOn ? [g.dependsOn] : [];
    });
    (t.commercialGoals||[]).forEach(g=>{
      if(!g.id) g.id = uid('g');
      if(!Array.isArray(g.projectIds)) g.projectIds = [];
      if(!g.status) g.status = 'not_started';
      if(!Array.isArray(g.dependsOnIds)) g.dependsOnIds = g.dependsOn ? [g.dependsOn] : [];
    });
    if(!Array.isArray(t.specs)) t.specs = [];
    t.specs.forEach(s=>{ if(!s.id) s.id = uid('sp'); if(!s.status) s.status = 'tbd'; });
  });
  data.projects.forEach(p=>{
    if(!p.status) p.status = 'on';
    if(p.keyDate === undefined) p.keyDate = '';
    if(!p.priority) p.priority = 'medium';
    if(!p.folder || !data.folders.some(f=>f.id===p.folder)) p.folder = data.folders[0].id;
    if(!Array.isArray(p.risks)) p.risks = [];
    if(!Array.isArray(p.specs)) p.specs = [];
    p.specs.forEach(s=>{ if(!s.id) s.id = uid('sp'); if(!s.status) s.status = 'tbd'; });
    p.team.forEach(t=>{
      if(!Array.isArray(t.tasks)){
        t.tasks = t.working ? [{ text: t.working, done: false, date: '' }] : [];
      }
      t.tasks.forEach(task=>{ if(task.date === undefined) task.date = ''; if(task.recurring === undefined) task.recurring = false; if(task.completedAt === undefined) task.completedAt = ''; });
    });
  });
  render();
  lastSavedSnapshot = JSON.parse(JSON.stringify(data));
  undoStack = [];
  updateUndoButtonUI();
  subscribeToRemoteChanges();
  if(justMigratedTopics){
    // Lock in this migration immediately so a teammate opening the app moments later
    // loads the already-migrated version instead of independently re-migrating their own copy.
    persist();
  }
}

async function persist(){
  if(applyingRemoteUpdate) return; // don't write back a change we just received from someone else
  const pill = document.getElementById('savePill');
  try{
    const { error } = await sb.from('boards').update({ data, updated_at: new Date().toISOString() }).eq('id', BOARD_ROW_ID);
    if(error) throw error;
    lastSavedSnapshot = JSON.parse(JSON.stringify(data)); // new checkpoint now that this batch of edits is saved
    pill.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=> pill.classList.remove('show'), 1200);
  }catch(e){ console.error('save failed', e); }
}
function scheduleSave(){
  if(!scheduleSave._t && lastSavedSnapshot){
    // first edit of a new burst — snapshot the pre-edit state so it can be undone
    undoStack.push(lastSavedSnapshot);
    if(undoStack.length > UNDO_LIMIT) undoStack.shift();
    updateUndoButtonUI();
  }
  clearTimeout(scheduleSave._t);
  scheduleSave._t = setTimeout(()=>{ scheduleSave._t = null; persist(); }, 500);
}

function updateUndoButtonUI(){
  const btn = document.getElementById('undoBtn');
  if(!btn) return;
  btn.disabled = undoStack.length === 0;
  btn.textContent = undoStack.length ? `⤺ Undo (${undoStack.length})` : '⤺ Undo';
}

function doUndo(){
  if(undoStack.length === 0) return;
  clearTimeout(scheduleSave._t); scheduleSave._t = null; // cancel any pending debounced save
  data = undoStack.pop();
  updateUndoButtonUI();
  render();
  persist(); // save the reverted state immediately so it syncs to everyone
}

// Live sync: when a teammate saves, pull their change in and re-render.
let remoteChannel = null;
function subscribeToRemoteChanges(){
  if(remoteChannel) return;
  remoteChannel = sb.channel('boards-changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'boards', filter: `id=eq.${BOARD_ROW_ID}` }, payload => {
      applyingRemoteUpdate = true;
      data = payload.new.data;
      lastSavedSnapshot = JSON.parse(JSON.stringify(data));
      undoStack = []; // a teammate's change landed — local undo history no longer applies cleanly, so reset it
      updateUndoButtonUI();
      render();
      applyingRemoteUpdate = false;
    })
    .subscribe();
}

function normalizeName(name){
  return (name || '')
    .replace(/\u00a0/g, ' ')   // non-breaking spaces from contenteditable
    .replace(/\s+/g, ' ')      // collapse repeated/newline whitespace
    .trim();
}

function getAllPeople(){
  const map = {};
  data.projects.forEach(p=>{
    p.team.forEach(t=>{
      const cleanName = normalizeName(t.name);
      if(!cleanName) return; // skip blank/whitespace-only entries
      // group case-insensitively, but keep the first-seen casing for display
      const key = Object.keys(map).find(k => k.toLowerCase() === cleanName.toLowerCase()) || cleanName;
      if(!map[key]) map[key] = [];
      map[key].push({ project: p.name, tasks: t.tasks||[], projectId: p.id });
    });
  });
  return map;
}

// ---------- Timeline / Gantt view ----------
const TIMELINE_PX_PER_DAY = 11; // fixed zoom level — roughly 3 months fit on screen before you need to scroll
function pxForDate(dateStr, startStr){
  return daysBetween(startStr, dateStr) * TIMELINE_PX_PER_DAY;
}
function computeTimelineWindow(topics, projects){
  const today = todayStr();
  let start = addDays(today, -14);
  let end = addDays(today, 60);
  const dates = [];
  topics.forEach(t=>{
    (t.techGoals||[]).forEach(g=>{ if(g.date) dates.push(g.date); });
    (t.commercialGoals||[]).forEach(g=>{ if(g.date) dates.push(g.date); });
  });
  projects.forEach(p=>{
    if(p.keyDate) dates.push(p.keyDate);
    p.team.forEach(t=> (t.tasks||[]).forEach(task=>{ if(!task.done && task.date) dates.push(task.date); }));
  });
  if(dates.length){
    const minD = dates.reduce((a,b)=> a<b?a:b);
    const maxD = dates.reduce((a,b)=> a>b?a:b);
    if(minD < start) start = addDays(minD, -7);
    if(maxD > end) end = addDays(maxD, 7);
  }
  return { start, end };
}
function buildMonthTicks(startStr, endStr){
  const ticks = [];
  const d = new Date(startStr + 'T00:00:00');
  d.setDate(1);
  const endD = new Date(endStr + 'T00:00:00');
  let guard = 0;
  while(d <= endD && guard < 60){
    const dStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const px = pxForDate(dStr, startStr);
    if(px >= 0){
      ticks.push({ px, label: d.toLocaleDateString('en-GB', { month:'short', year:'2-digit' }) });
    }
    d.setMonth(d.getMonth()+1);
    guard++;
  }
  return ticks;
}

function renderTimeline(){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="page-head">
      <div>
        <div class="page-eyebrow">Overview</div>
        <h1 class="page-title">Timeline</h1>
        <div class="page-sub">Every goal and open task gets its own row so you can read what it actually is. A thin bar shows a goal waiting on a dependency. The vertical line marks today, live.</div>

    </div>
  `;

  const projectsAll = projectsForActiveFilter();
  if(projectsAll.length === 0){
    const empty = document.createElement('div');
    empty.className = 'page-sub'; empty.style.marginTop = '16px';
    empty.textContent = 'No projects to show yet.';
    wrap.appendChild(empty);
    return wrap;
  }

  let topicsToShow;
  if(activeFolder === 'all'){
    topicsToShow = data.topics;
  } else if(typeof activeFolder === 'string' && activeFolder.startsWith('topic:')){
    topicsToShow = data.topics.filter(t=>t.id===activeFolder.slice(6));
  } else {
    const t = topicForFolder(activeFolder);
    topicsToShow = t ? [t] : [];
  }

  const { start, end } = computeTimelineWindow(topicsToShow, projectsAll);
  const totalDays = Math.max(1, daysBetween(start, end));
  const trackWidth = totalDays * TIMELINE_PX_PER_DAY;
  const todayPx = pxForDate(todayStr(), start);
  const LABEL_WIDTH = 220;

  const scrollArea = document.createElement('div');
  scrollArea.className = 'timeline-scroll';

  const inner = document.createElement('div');
  inner.className = 'timeline-scroll-inner';
  inner.style.width = (LABEL_WIDTH + trackWidth) + 'px';

  const axis = document.createElement('div');
  axis.className = 'timeline-axis';
  axis.style.marginLeft = LABEL_WIDTH + 'px';
  axis.style.width = trackWidth + 'px';
  buildMonthTicks(start, end).forEach(tick=>{
    const el = document.createElement('div');
    el.className = 'timeline-month-tick';
    el.style.left = tick.px + 'px';
    el.textContent = tick.label;
    axis.appendChild(el);
  });
  inner.appendChild(axis);

  const body = document.createElement('div');
  body.className = 'timeline-body';
  let anyRows = false;

  function addItemRow(label, date, kind, blocked, onClick, barFromDate){
    const row = document.createElement('div');
    row.className = 'timeline-row';
    const labelEl = document.createElement('div');
    labelEl.className = 'timeline-row-label';
    labelEl.style.width = LABEL_WIDTH + 'px';
    labelEl.textContent = label;
    labelEl.title = label;
    if(onClick){ labelEl.onclick = onClick; }
    row.appendChild(labelEl);

    const track = document.createElement('div');
    track.className = 'timeline-row-track';
    track.style.width = trackWidth + 'px';

    if(!date){
      track.innerHTML = `<span class="timeline-no-dates">No date set</span>`;
    } else {
      if(barFromDate && barFromDate !== date){
        const earlyDate = barFromDate < date ? barFromDate : date;
        const lateDate = barFromDate < date ? date : barFromDate;
        const leftPx = pxForDate(earlyDate, start);
        const rightPx = pxForDate(lateDate, start);
        const bar = document.createElement('div');
        bar.className = 'timeline-dep-bar';
        bar.style.left = leftPx + 'px';
        bar.style.width = Math.max(4, rightPx - leftPx) + 'px';
        bar.title = 'Waiting on a dependency before this can start';
        track.appendChild(bar);
      }
      const isOverdue = date < todayStr();
      const marker = document.createElement('div');
      marker.className = `timeline-marker ${kind}${(isOverdue && kind !== 'keydate') ? ' overdue' : ''}${blocked ? ' blocked' : ''}`;
      marker.style.left = pxForDate(date, start) + 'px';
      marker.title = `${label} — ${fmtDate(date)}${blocked ? ' (waiting on another goal)' : ''}`;
      if(onClick) marker.onclick = (e)=>{ e.stopPropagation(); onClick(); };
      track.appendChild(marker);
    }
    row.appendChild(track);
    body.appendChild(row);
    anyRows = true;
  }

  // A dependent goal's implied "start" is the latest due date among its dependencies —
  // this draws a thin bar showing the wait, without needing a separate start-date field.
  function latestDependencyDate(goal, topic){
    const deps = dependencyGoals(goal, topic).filter(d=>d.date);
    if(deps.length === 0) return null;
    return deps.map(d=>d.date).sort().slice(-1)[0];
  }

  topicsToShow.forEach(topic=>{
    const topicFolderIds = data.folders.filter(f=>f.topicId===topic.id).map(f=>f.id);

    const sharedGoals = [
      ...(topic.techGoals||[]).filter(g=>effectiveGoalProjectIds(g).length===0).map(g=>({ goal:g, kind:'tech', label:`Tech · ${g.text||'Untitled goal'}` })),
      ...(topic.commercialGoals||[]).filter(g=>(!g.projectIds || g.projectIds.length===0)).map(g=>({ goal:g, kind:'commercial', label:`Commercial · ${g.text||'Untitled goal'}` }))
    ].filter(x=>x.goal.date).sort((a,b)=> a.goal.date.localeCompare(b.goal.date));

    if(sharedGoals.length){
      const subHead = document.createElement('div');
      subHead.className = 'timeline-project-heading';
      subHead.textContent = `${topic.label} goals (shared)`;
      subHead.onclick = ()=>{ activeFolder = 'topic:'+topic.id; activeTab = 'summary'; render(); };
      body.appendChild(subHead);
      sharedGoals.forEach(({goal, kind, label})=>{
        addItemRow(label, goal.date, kind, isGoalBlocked(goal, topic),
          ()=>{ activeFolder = 'topic:'+topic.id; activeTab = 'summary'; render(); },
          latestDependencyDate(goal, topic));
      });
    }

    projectsInTopic.forEach(p=>{
      const pHeading = document.createElement('div');
      pHeading.className = 'timeline-project-heading';
      pHeading.textContent = p.name;
      pHeading.onclick = ()=>{ activeTab = p.id; render(); };
      body.appendChild(pHeading);

      let rowsBefore = false;
      const openClick = ()=>{ activeTab = p.id; render(); };

      if(p.keyDate){
        addItemRow('Key date', p.keyDate, 'keydate', false, openClick);
        rowsBefore = true;
      }
      const projectGoals = [
        ...(topic.techGoals||[]).filter(g=>{ const v = effectiveGoalProjectIds(g); return v.length>0 && v.includes(p.id); }).map(g=>({ goal:g, kind:'tech', label:`Tech · ${g.text||'Untitled goal'}` })),
        ...(topic.commercialGoals||[]).filter(g=>g.projectIds && g.projectIds.length>0 && g.projectIds.includes(p.id)).map(g=>({ goal:g, kind:'commercial', label:`Commercial · ${g.text||'Untitled goal'}` }))
      ].filter(x=>x.goal.date).sort((a,b)=> a.goal.date.localeCompare(b.goal.date));
      projectGoals.forEach(({goal, kind, label})=>{
        addItemRow(label, goal.date, kind, isGoalBlocked(goal, topic), openClick, latestDependencyDate(goal, topic));
        rowsBefore = true;
      });

      const taskRows = [];
      p.team.forEach(t=> (t.tasks||[]).forEach(task=>{ if(!task.done && task.date) taskRows.push({ t, task }); }));
      taskRows.sort((a,b)=> a.task.date.localeCompare(b.task.date));
      taskRows.forEach(({t, task})=>{
        addItemRow(`${t.name} · ${task.text||'Untitled task'}`, task.date, 'task', false, openClick);
        rowsBefore = true;
      });

      if(!rowsBefore){
        const row = document.createElement('div');
        row.className = 'timeline-row';
        row.innerHTML = `<div class="timeline-row-label" style="width:${LABEL_WIDTH}px;">—</div><div class="timeline-row-track" style="width:${trackWidth}px;"><span class="timeline-no-dates">No dated goals or tasks yet</span></div>`;
        body.appendChild(row);
        anyRows = true;
      }
    });
  });

  inner.appendChild(body);

  const todayLine = document.createElement('div');
  todayLine.className = 'timeline-today-line';
  todayLine.style.left = (LABEL_WIDTH + todayPx) + 'px';
  todayLine.innerHTML = `<span class="timeline-today-label">Today</span>`;
  inner.appendChild(todayLine);

  scrollArea.appendChild(inner);
  wrap.appendChild(scrollArea);

  // Jump the scroll position so "today" starts near the left edge rather than requiring a scroll to find it.
  requestAnimationFrame(()=>{ scrollArea.scrollLeft = Math.max(0, todayPx - 60); });

  if(!anyRows){
    const empty = document.createElement('div');
    empty.className = 'page-sub'; empty.style.marginTop = '16px';
    empty.textContent = 'No projects to show yet.';
    wrap.appendChild(empty);

  const legend = document.createElement('div');

  wrap.appendChild(legend);

function countOpenTasks(p){
  let n = 0;
  p.team.forEach(t=> (t.tasks||[]).forEach(task=>{ if(!task.done) n++; }));
  return n;
}

function rankProjects(projects){
  return [...projects].sort((a,b)=>{
    const pa = PRIORITY_ORDER.indexOf(a.priority), pb = PRIORITY_ORDER.indexOf(b.priority);
    if(pa !== pb) return pb - pa; // highest priority first
    const da = a.keyDate || '9999-12-31', db = b.keyDate || '9999-12-31';
    if(da !== db) return da < db ? -1 : 1; // soonest key date first
    const oa = countOpenTasks(a), ob = countOpenTasks(b);
    if(oa !== ob) return ob - oa; // most open tasks first
    return a.name.localeCompare(b.name);
  });
}

function buildAgendaForTopic(topicId){
  const topic = data.topics.find(t=>t.id===topicId);
  const projects = rankProjects(data.projects.filter(p=>{ const t = topicForProject(p); return t && t.id === topicId; }));
  const today = todayStr();
  const completed = [];
  const upcoming = [];
  const overdue = [];
  const keyDates = [];
  const capacity = {};

  // Topic-level goals — each pushed once (not per project), labelled with which project(s) they apply to
  if(topic){
    [['Tech goal', topic.techGoals, 'tech'], ['Commercial goal', topic.commercialGoals, 'commercial']].forEach(([kindLabel, list, kind])=>{
      (list||[]).forEach(g=>{
        if(!g.date) return;
        const label = `${kindLabel}: ${g.text || 'Untitled'}${isGoalBlocked(g, topic) ? ' (waiting on another goal)' : ''}`;
        const visIds = effectiveGoalProjectIds(g);
        let scopeLabel = `${topic.label} — all projects`;
        if(visIds.length > 0){
          const names = visIds.map(pid=>{ const proj = data.projects.find(x=>x.id===pid); return proj ? proj.name : null; }).filter(Boolean);
          if(names.length) scopeLabel = names.join(', ');
        }
        if(g.date >= today) keyDates.push({ projectName: scopeLabel, label, date:g.date, kind });
        if(isWithinNextDays(g.date, 14)) upcoming.push({ projectName: scopeLabel, label, date:g.date, kind });
      });
    });
  }

  projects.forEach(p=>{
    if(p.keyDate && p.keyDate >= today) keyDates.push({ projectName:p.name, label:'Key date', date:p.keyDate, kind:null });
    p.team.forEach(t=>{
      if(!capacity[t.name]) capacity[t.name] = { open:0, overdue:0, recurring:0 };
      (t.tasks||[]).forEach(task=>{
        if(!task.text && !task.done) return; // skip blank placeholder rows
        if(!task.done){
          capacity[t.name].open++;
          if(task.recurring) capacity[t.name].recurring++;
          if(task.date && task.date < today){
            capacity[t.name].overdue++;
            overdue.push({ projectName:p.name, person:t.name, text:task.text, date:task.date, days: daysBetween(task.date, today) });
          } else if(isWithinNextDays(task.date, 14)){
            upcoming.push({ projectName:p.name, person:t.name, label:task.text || 'Untitled task', date:task.date, kind:'task' });
          }
        } else if(isWithinLastDays(task.completedAt, 14)){
          completed.push({ projectName:p.name, person:t.name, text:task.text, date:task.completedAt });
        }
      });
    });
  });

  completed.sort((a,b)=> b.date.localeCompare(a.date));
  upcoming.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  overdue.sort((a,b)=> b.days - a.days);
  keyDates.sort((a,b)=> a.date.localeCompare(b.date));

  return { projects, completed, upcoming, overdue, keyDates, capacity };
}

function copyAgendaText(folder, agenda, focusLabel, btn){
  const lines = [];
  lines.push(`MEETING AGENDA — ${folder.label} team (${focusLabel})`);
  lines.push(`Generated ${fmtDate(todayStr())}`);
  lines.push('');
  lines.push('PROJECTS (ranked by priority, next date, open tasks)');
  agenda.projects.forEach((p,i)=>{
    lines.push(`${i+1}. ${p.name} — ${PRIORITY_LABELS[p.priority]} — ${p.keyDate ? fmtDate(p.keyDate) : 'no date'} — ${countOpenTasks(p)} open tasks`);
  });
  lines.push('');
  lines.push('COMPLETED IN THE LAST 2 WEEKS');
  if(agenda.completed.length===0) lines.push('- None');
  agenda.completed.forEach(i=> lines.push(`- ${i.person} — ${i.text || 'Untitled task'} (${i.projectName}, ${fmtDate(i.date)})`));
  lines.push('');
  lines.push('COMING UP IN THE NEXT 2 WEEKS');
  const upcomingForCopy = focusLabel === 'All' ? agenda.upcoming : agenda.upcoming.filter(i=> i.kind==='task' || meetingLabel(i.kind) === focusLabel);
  if(upcomingForCopy.length===0) lines.push('- None');
  upcomingForCopy.forEach(i=> lines.push(`- ${i.person ? i.person+' — ' : ''}${i.label || 'Untitled'} (${i.projectName}, ${fmtDate(i.date)})`));
  lines.push('');
  lines.push('OPEN TASKS THAT ARE OVERDUE');
  if(agenda.overdue.length===0) lines.push('- None');
  agenda.overdue.forEach(i=> lines.push(`- ${i.person} — ${i.text || 'Untitled task'} (${i.projectName}, ${i.days} day${i.days===1?'':'s'} overdue)`));
  lines.push('');
  lines.push('TEAM CAPACITY');
  const capNames = Object.keys(agenda.capacity).sort((a,b)=> agenda.capacity[b].open - agenda.capacity[a].open);
  if(capNames.length===0) lines.push('- None');
  capNames.forEach(name=>{
    const c = agenda.capacity[name];
    lines.push(`- ${name}: ${c.open} open${c.overdue ? `, ${c.overdue} overdue` : ''}${c.recurring ? `, ${c.recurring} recurring` : ''}`);
  });
  lines.push('');
  lines.push('KEY DATES COMING UP');
  if(agenda.keyDates.length===0) lines.push('- None');
  agenda.keyDates.forEach(i=> lines.push(`- ${i.label} (${i.projectName}, ${fmtDate(i.date)})`));

  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const orig = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(()=>{ btn.textContent = orig; }, 1500);
  }).catch(()=>{
    alert('Could not copy automatically — select the agenda text manually instead.');
  });
}

function renderAgenda(){
  const wrap = document.createElement('div');
  if(!data.topics.length){
    wrap.innerHTML = `<div class="page-head"><div><div class="page-eyebrow">Meeting agenda</div><h1 class="page-title">No topics yet</h1><div class="page-sub">Add a topic from the sidebar first — agendas are generated per team/topic.</div></div></div>`;
    return wrap;
  }
  if(!activeAgendaFolder || !data.topics.some(t=>t.id===activeAgendaFolder)){
    const currentTopicId = typeof activeFolder === 'string' && activeFolder.startsWith('topic:')
      ? activeFolder.slice(6)
      : (topicForFolder(activeFolder) ? topicForFolder(activeFolder).id : null);
    activeAgendaFolder = (currentTopicId && data.topics.some(t=>t.id===currentTopicId)) ? currentTopicId : data.topics[0].id;
  }
  const topic = data.topics.find(t=>t.id===activeAgendaFolder);
  const agenda = buildAgendaForTopic(activeAgendaFolder);

  const head = document.createElement('div');
  head.className = 'page-head';
  head.style.display = 'block';
  head.innerHTML = `
    <div class="page-eyebrow">Meeting agenda</div>
    <h1 class="page-title">${escapeHtml(topic.label)} team</h1>
    <div class="page-sub">Auto-generated from ${agenda.projects.length} project${agenda.projects.length===1?'':'s'} under this topic. Covers the last 14 days and the next 14 days.</div>
  `;
  wrap.appendChild(head);

  const picker = document.createElement('div');
  picker.className = 'agenda-folder-picker';
  data.topics.forEach(t=>{
    const pill = document.createElement('button');
    pill.className = 'agenda-folder-pill' + (t.id===activeAgendaFolder ? ' active' : '');
    pill.innerHTML = `<span class="fdot" style="background:${topicColor(t.id)}"></span>${escapeHtml(t.label)}`;
    pill.onclick = ()=>{ activeAgendaFolder = t.id; render(); };
    picker.appendChild(pill);
  });
  const copyBtn = document.createElement('button');
  copyBtn.className = 'agenda-copy-btn';
  copyBtn.textContent = 'Copy for meeting notes';
  copyBtn.onclick = ()=> copyAgendaText(topic, agenda, meetingLabel(activeAgendaMeetingType), copyBtn);
  picker.appendChild(copyBtn);
  wrap.appendChild(picker);

  const focusPicker = document.createElement('div');
  focusPicker.className = 'agenda-focus-picker';
  [['all','All'],['tech','Tech meeting'],['commercial','Commercial meeting']].forEach(([val,label])=>{
    const pill = document.createElement('button');
    pill.className = 'agenda-focus-pill' + (activeAgendaMeetingType===val ? ' active' : '');
    pill.textContent = label;
    pill.onclick = ()=>{ activeAgendaMeetingType = val; render(); };
    focusPicker.appendChild(pill);
  });
  wrap.appendChild(focusPicker);

  if(agenda.projects.length === 0){
    const empty = document.createElement('div');
    empty.className = 'page-sub';
    empty.style.marginTop = '16px';
    empty.textContent = `No projects under the "${topic.label}" topic yet.`;
    wrap.appendChild(empty);
    return wrap;
  }

  const focus = activeAgendaMeetingType;
  const otherFocus = focus === 'tech' ? 'commercial' : focus === 'commercial' ? 'tech' : null;
  const upcomingShown = focus === 'all' ? agenda.upcoming : agenda.upcoming.filter(i=> i.kind==='task' || i.kind===focus);
  const keyDatesShown = focus === 'all' ? agenda.keyDates : agenda.keyDates.filter(i=> !i.kind || i.kind===focus);
  const crossContext = otherFocus ? agenda.upcoming.filter(i=> i.kind===otherFocus) : [];

  const rankSec = document.createElement('div');
  rankSec.className = 'agenda-section';
  rankSec.innerHTML = `<div class="agenda-section-title">Projects, ranked (priority → next date → open tasks)</div>`;
  const rankList = document.createElement('div');
  rankList.className = 'agenda-rank-list';
  agenda.projects.forEach((p, i)=>{
    const openCount = countOpenTasks(p);
    const row = document.createElement('div');
    row.className = 'agenda-rank-item';
    row.innerHTML = `
      <span class="agenda-rank-num">${i+1}</span>
      <span class="agenda-rank-name">${escapeHtml(p.name)}</span>
      <span class="p-flag ${p.priority}">${PRIORITY_LABELS[p.priority]}</span>
      <span class="agenda-rank-meta">${p.keyDate ? fmtDate(p.keyDate) : 'No date'} · ${openCount} open task${openCount===1?'':'s'}</span>
    `;
    row.onclick = ()=>{ activeTab = p.id; render(); };
    rankList.appendChild(row);
  });
  rankSec.appendChild(rankList);
  wrap.appendChild(rankSec);

  wrap.appendChild(renderAgendaSection('Completed in the last 2 weeks', agenda.completed, item=>
    `<span class="agenda-item-main">${escapeHtml(item.person)} — ${escapeHtml(item.text || 'Untitled task')}</span><span class="agenda-item-meta">${escapeHtml(item.projectName)} · ${fmtDate(item.date)}</span>`,
    'Nothing marked complete in the last two weeks yet.'
  ));

  wrap.appendChild(renderAgendaSection('Coming up in the next 2 weeks', upcomingShown, item=>
    `<span class="agenda-item-main">${item.person ? escapeHtml(item.person)+' — ' : ''}${escapeHtml(item.label || 'Untitled')}</span><span class="agenda-item-meta">${escapeHtml(item.projectName)} · ${fmtDate(item.date)}</span>`,
    'Nothing scheduled in the next two weeks.'
  ));

  if(otherFocus && crossContext.length > 0){
    const cross = document.createElement('div');
    cross.className = 'agenda-cross-box';
    cross.innerHTML = `<div class="agenda-cross-title">Also on the ${meetingLabel(otherFocus)} radar — for alignment</div>`;
    const list = document.createElement('div');
    list.className = 'agenda-item-list';
    crossContext.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'agenda-item-row';
      row.innerHTML = `<span class="agenda-item-main">${escapeHtml(item.label || 'Untitled')}</span><span class="agenda-item-meta">${escapeHtml(item.projectName)} · ${fmtDate(item.date)}</span>`;
      list.appendChild(row);
    });
    cross.appendChild(list);
    wrap.appendChild(cross);
  }

  wrap.appendChild(renderAgendaSection('Open tasks that are overdue', agenda.overdue, item=>
    `<span class="agenda-item-main">${escapeHtml(item.person)} — ${escapeHtml(item.text || 'Untitled task')}</span><span class="agenda-item-meta agenda-overdue-tag">${escapeHtml(item.projectName)} · ${item.days} day${item.days===1?'':'s'} overdue</span>`,
    'No overdue tasks — nice.'
  ));

  const capSec = document.createElement('div');
  capSec.className = 'agenda-section';
  capSec.innerHTML = `<div class="agenda-section-title">Team capacity</div>`;
  const capNames = Object.keys(agenda.capacity).sort((a,b)=> agenda.capacity[b].open - agenda.capacity[a].open);
  if(capNames.length === 0){
    capSec.innerHTML += `<div class="agenda-empty">No team members assigned in this filter.</div>`;
  } else {
    const capList = document.createElement('div');
    capList.className = 'agenda-cap-list';
    capNames.forEach(name=>{
      const c = agenda.capacity[name];
      const row = document.createElement('div');
      row.className = 'agenda-cap-row';
      row.innerHTML = `
        <div class="avatar-lg" style="background:${personColor(name)}">${initials(name)}</div>
        <span class="agenda-cap-name">${escapeHtml(name)}</span>
        <span class="agenda-cap-stat">${c.open} open</span>
        ${c.overdue ? `<span class="agenda-cap-stat agenda-overdue-tag">${c.overdue} overdue</span>` : ''}
        ${c.recurring ? `<span class="agenda-cap-stat agenda-recur-tag">${c.recurring} recurring</span>` : ''}
      `;
      capList.appendChild(row);
    });
    capSec.appendChild(capList);
  }
  wrap.appendChild(capSec);

  wrap.appendChild(renderAgendaSection('Key dates coming up', keyDatesShown, item=>
    `<span class="agenda-item-main">${escapeHtml(item.label)}</span><span class="agenda-item-meta">${escapeHtml(item.projectName)} · ${fmtDate(item.date)}</span>`,
    'No upcoming key dates logged.'
  ));

  return wrap;
}

function renderProject(p){

        <span class="status-block-label">Next key date</span>

      </div>
    </div>

  head.querySelector('.page-sub').addEventListener('input', e=>{ p.summary = e.target.textContent; scheduleSave(); });
  head.querySelector('.status-toggle').onclick = ()=>{
    p.status = STATUS_ORDER[(STATUS_ORDER.indexOf(p.status)+1) % STATUS_ORDER.length];
    render(); scheduleSave();
  };
  head.querySelector('.priority-toggle').onclick = ()=>{
    p.priority = PRIORITY_ORDER[(PRIORITY_ORDER.indexOf(p.priority)+1) % PRIORITY_ORDER.length];
    render(); scheduleSave();
  };
  head.querySelector('.folder-toggle').onclick = ()=>{

  twoCol.className = 'two-col';

    twoCol.appendChild(renderGoalSection(`Key tech goals`, topic.techGoals, topic, p.id));
    twoCol.appendChild(renderGoalSection(`Key commercial goals`, topic.commercialGoals, topic, p.id));
  }
  wrap.appendChild(twoCol);

  wrap.appendChild(renderSpecsSection(p));

  wrap.appendChild(renderTeamSection(p));

  wrap.appendChild(renderRiskSection(p));

  const danger = document.createElement('div');
  danger.className = 'danger-zone';
  danger.innerHTML = `<span class="del-project">Delete this project</span>`;
  danger.querySelector('.del-project').onclick = ()=>{
    if(confirm(`Delete "${p.name}"? This can't be undone.`)){
      data.projects = data.projects.filter(x=>x.id!==p.id);
      activeTab = 'summary';
      render(); scheduleSave();
    }
  };
  wrap.appendChild(danger);

  return wrap;
}

let openGoalPickerId = null; // which goal's "visible on" picker is currently expanded
let openDependsPickerId = null; // which goal's "depends on" picker is currently expanded

function renderGoalSection(title, list, topic, currentProjectId){
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-head"><div class="section-title"><span class="ico"></span>${title}</div>${topic ? `<span class="shared-badge" title="Editing here can update it wherever else this goal applies">Shared · ${escapeHtml(topic.label)}</span>` : ''}</div>`;
  const ul = document.createElement('ul');
  ul.className = 'goal-list';
  const topicProjects = topic ? projectsInTopic(topic.id) : [];
  const visible = currentProjectId
    ? list.filter(g=> goalAppliesToProject(effectiveGoalProjectIds(g), currentProjectId))
    : list;

  visible.forEach(goal=>{
    const li = document.createElement('li');
    const visIds = effectiveGoalProjectIds(goal);
    const appliesToAll = visIds.length === 0;
    const visLabel = appliesToAll ? 'All projects' : (topicProjects.filter(p=>visIds.includes(p.id)).map(p=>p.name).join(', ') || 'All projects');
    if(!goal.status) goal.status = 'not_started';
    if(!Array.isArray(goal.dependsOnIds)) goal.dependsOnIds = [];
    const blocked = isGoalBlocked(goal, topic);
    const depGoals = dependencyGoals(goal, topic);
    const waitingOnGoals = unfinishedDependencies(goal, topic);

    const visibilityBlock = (topicProjects.length > 1)
      ? `<div class="goal-visible-picker">
          <button type="button" class="goal-visible-icon${!appliesToAll ? ' active' : ''}" title="Relevant to: ${escapeHtml(visLabel)}">📍</button>
          ${openGoalPickerId === goal.id ? `
            <div class="goal-visible-panel">
              <label class="goal-visible-option"><input type="checkbox" class="goal-visible-all" ${appliesToAll ? 'checked' : ''}> All projects</label>
              ${topicProjects.map(p=>`<label class="goal-visible-option"><input type="checkbox" class="goal-visible-one" data-pid="${p.id}" ${visIds.includes(p.id) ? 'checked' : ''}> ${escapeHtml(p.name)}</label>`).join('')}
              <button type="button" class="goal-visible-done">Done</button>
            </div>` : ''}
          ${!appliesToAll ? `<span class="goal-visible-caption" title="${escapeHtml(visLabel)}">${escapeHtml(visLabel)}</span>` : ''}
        </div>`
      : '';

    // Depends-on options: every other goal in the topic (tech + commercial), excluding itself and
    // anything that already depends on this goal (a simple guard against an immediate 2-way cycle).
    const depOptions = topic ? allTopicGoals(topic).filter(g=> g.id !== goal.id && !(Array.isArray(g.dependsOnIds) && g.dependsOnIds.includes(goal.id))) : [];
    const dependsTitle = depGoals.length ? `Depends on: ${depGoals.map(d=>d.text||'Untitled goal').join(', ')}` : 'Set dependencies';

    li.innerHTML = `
      <div class="goal-row-main">
        <span class="bullet"></span>
        <span class="goal-text" contenteditable="true" data-ph="Describe the goal...">${escapeHtml(goal.text)}</span>
        <input type="date" class="goal-date" value="${escapeHtml(goal.date||'')}">
        <span class="rm-btn">×</span>
      </div>
      <div class="goal-controls-row">
        <button type="button" class="goal-status-pill ${goal.status}">${GOAL_STATUS_LABELS[goal.status]}</button>
        ${visibilityBlock}
        ${topic ? `
          <div class="goal-visible-picker">
            <button type="button" class="goal-depends-icon${goal.dependsOnIds.length ? ' active' : ''}" title="${escapeHtml(dependsTitle)}">🔗</button>
            ${openDependsPickerId === goal.id ? `
              <div class="goal-visible-panel">
                ${depOptions.length === 0 ? `<div class="goal-visible-option" style="cursor:default;">No other goals yet</div>` : depOptions.map(o=>{
                  const isTechOption = (topic.techGoals||[]).includes(o);
                  return `<label class="goal-visible-option"><input type="checkbox" class="goal-depends-check" data-gid="${o.id}" ${goal.dependsOnIds.includes(o.id) ? 'checked' : ''}> [${isTechOption ? 'Tech' : 'Commercial'}] ${escapeHtml(o.text || 'Untitled goal')}</label>`;
                }).join('')}
                <button type="button" class="goal-depends-panel-done">Done</button>
              </div>` : ''}
          </div>
        ` : ''}
        ${blocked ? `<span class="goal-blocked-tag" title="${escapeHtml(waitingOnGoals.map(d=>d.text||'Untitled goal').join(', '))}">⏳ Waiting on: ${escapeHtml(waitingOnGoals.map(d=>d.text||'Untitled goal').join(', '))}</span>` : ''}
      </div>
    `;
    li.querySelector('.goal-text').addEventListener('input', e=>{ goal.text = e.target.textContent; scheduleSave(); });
    li.querySelector('.goal-date').addEventListener('change', e=>{ goal.date = e.target.value; scheduleSave(); });
    li.querySelector('.rm-btn').onclick = ()=>{
      const idx = list.findIndex(g=>g===goal);
      if(idx > -1) list.splice(idx,1);
      render(); scheduleSave();
    };
    li.querySelector('.goal-status-pill').addEventListener('click', e=>{
      goal.status = GOAL_STATUS_ORDER[(GOAL_STATUS_ORDER.indexOf(goal.status)+1) % GOAL_STATUS_ORDER.length];
      render(); scheduleSave();
    });
    const dependsIcon = li.querySelector('.goal-depends-icon');
    if(dependsIcon){
      dependsIcon.addEventListener('click', ()=>{
        openDependsPickerId = (openDependsPickerId === goal.id) ? null : goal.id;
        render();
      });
    }
    li.querySelectorAll('.goal-depends-check').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const gid = e.target.dataset.gid;
        if(!Array.isArray(goal.dependsOnIds)) goal.dependsOnIds = [];
        if(e.target.checked){
          if(!goal.dependsOnIds.includes(gid)) goal.dependsOnIds.push(gid);
        } else {
          goal.dependsOnIds = goal.dependsOnIds.filter(id=>id!==gid);
        }
        render(); scheduleSave();
      });
    });
    const dependsDoneBtn = li.querySelector('.goal-depends-panel-done');
    if(dependsDoneBtn){
      dependsDoneBtn.addEventListener('click', ()=>{ openDependsPickerId = null; render(); });
    }
    const toggleBtn = li.querySelector('.goal-visible-icon');
    if(toggleBtn){
      toggleBtn.addEventListener('click', ()=>{
        openGoalPickerId = (openGoalPickerId === goal.id) ? null : goal.id;
        render();
      });
    }
    const allCheckbox = li.querySelector('.goal-visible-all');
    if(allCheckbox){
      allCheckbox.addEventListener('change', e=>{
        if(e.target.checked){ goal.projectIds = []; render(); scheduleSave(); }
      });
    }
    li.querySelectorAll('.goal-visible-one').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const pid = e.target.dataset.pid;
        if(!Array.isArray(goal.projectIds)) goal.projectIds = [];
        if(e.target.checked){
          if(!goal.projectIds.includes(pid)) goal.projectIds.push(pid);
        } else {
          goal.projectIds = goal.projectIds.filter(id=>id!==pid);
        }
        render(); scheduleSave();
      });
    });
    const doneBtn = li.querySelector('.goal-visible-done');
    if(doneBtn){
      doneBtn.addEventListener('click', ()=>{ openGoalPickerId = null; render(); });
    }
    ul.appendChild(li);
  });
  sec.appendChild(ul);
  const add = document.createElement('div');
  add.className = 'add-line';
  add.textContent = '+ add goal';
  add.onclick = ()=>{
    list.push({ id: uid('g'), text:'New goal', date:'', linksTo:'', projectIds: currentProjectId ? [currentProjectId] : [], status:'not_started', dependsOnIds:[] });
    render(); scheduleSave();
  };
  sec.appendChild(add);
  return sec;
}

      <span class="risk-text" contenteditable="true" data-ph="Describe the risk...">${escapeHtml(risk.text)}</span>
      <button class="risk-sev ${risk.severity}">${RISK_SEV_LABELS[risk.severity]}</button>
      <span class="rm-btn">×</span>
    `;
    li.querySelector('.risk-text').addEventListener('input', e=>{ risk.text = e.target.textContent; scheduleSave(); });
    li.querySelector('.risk-sev').onclick = e=>{
      risk.severity = RISK_SEV_ORDER[(RISK_SEV_ORDER.indexOf(risk.severity)+1) % RISK_SEV_ORDER.length];
      e.target.className = `risk-sev ${risk.severity}`;
      e.target.textContent = RISK_SEV_LABELS[risk.severity];
      scheduleSave();
    };
    li.querySelector('.rm-btn').onclick = ()=>{ p.risks.splice(idx,1); render(); scheduleSave(); };
    ul.appendChild(li);
  });
  sec.appendChild(ul);
  if(p.risks.length === 0){
    const empty = document.createElement('div');
    empty.className = 'page-sub';
    empty.style.marginBottom = '4px';
    empty.textContent = 'No risks logged.';
    sec.appendChild(empty);
  }
  const add = document.createElement('div');
  add.className = 'add-line';
  add.textContent = '+ add risk';
  add.onclick = ()=>{ p.risks.push({ text:'New risk', severity:'med' }); render(); scheduleSave(); };
  sec.appendChild(add);
  return sec;
}

function renderTeamSection(p){
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-head"><div class="section-title"><span class="ico"></span>Team & what they're working on</div></div>`;
  p.team.forEach((t, idx)=>{
    if(!Array.isArray(t.tasks)) t.tasks = t.working ? [{ text: t.working, done:false }] : [];
    const row = document.createElement('div');
    row.className = 'team-row';
    row.innerHTML = `
      <div class="avatar-lg" style="background:${personColor(t.name)}">${initials(t.name||'?')}</div>
      <span class="team-name" contenteditable="true" data-ph="Name">${escapeHtml(t.name)}</span>
      <span class="team-role" contenteditable="true" data-ph="Role">${escapeHtml(t.role||'')}</span>
      <div class="team-working"></div>
      <span class="rm-btn">×</span>
    `;
    row.querySelector('.team-name').addEventListener('input', e=>{ t.name = e.target.textContent; scheduleSave(); renderSidebarOnly(); row.querySelector('.avatar-lg').style.background = personColor(t.name); });
    row.querySelector('.team-name').addEventListener('blur', e=>{
      const clean = normalizeName(e.target.textContent);
      if(clean !== e.target.textContent){ e.target.textContent = clean; }
      t.name = clean;
      scheduleSave(); renderSidebarOnly();
    });
    row.querySelector('.team-role').addEventListener('input', e=>{ t.role = e.target.textContent; scheduleSave(); });
    row.querySelector('.team-working').appendChild(renderTaskList(t, p, idx));
    row.querySelector('.rm-btn').onclick = ()=>{ p.team.splice(idx,1); render(); scheduleSave(); };
    sec.appendChild(row);
  });
  const add = document.createElement('div');
  add.className = 'add-line';
  add.textContent = '+ add team member';
  add.onclick = ()=>{ p.team.push({ name:'New person', role:'Role', tasks:[] }); render(); scheduleSave(); };
  sec.appendChild(add);
  return sec;
}

function renderTaskList(t, p, selfIdx){
  const container = document.createElement('div');
  const ul = document.createElement('ul');
  ul.className = 'task-list';
  t.tasks.forEach((task, tIdx)=>{
    const li = document.createElement('li');
    li.className = 'task-row';
    const isOverdue = task.date && !task.done && task.date < todayStr();
    const assigneeSelect = (p && p.team.length > 1)
      ? `<select class="task-assignee" title="Reassign this task to someone else">${p.team.map((member,mIdx)=>
          `<option value="${mIdx}" ${mIdx===selfIdx ? 'selected' : ''}>${escapeHtml(member.name || 'Unnamed')}</option>`
        ).join('')}</select>`
      : '';
    li.innerHTML = `
      <input type="checkbox" class="task-check" ${task.done ? 'checked' : ''}>
      <span class="task-text${task.done ? ' done' : ''}" contenteditable="true" data-ph="What are they working on...">${escapeHtml(task.text)}</span>
      ${assigneeSelect}
      <span class="task-recur-toggle${task.recurring ? ' active' : ''}" title="${task.recurring ? 'Switch to one-off task' : 'Mark as recurring task'}">⟳</span>
      ${task.recurring
        ? `<span class="task-recur-label" title="Click to switch back to a one-off task">Repeats</span>`
        : `<input type="date" class="task-date${isOverdue ? ' overdue' : ''}" value="${escapeHtml(task.date||'')}">`
      }
      <span class="task-rm">×</span>
    `;
    li.querySelector('.task-check').addEventListener('change', e=>{
      task.done = e.target.checked;
      task.completedAt = task.done ? todayStr() : '';
      li.querySelector('.task-text').classList.toggle('done', task.done);
      const dateEl = li.querySelector('.task-date');
      if(dateEl) dateEl.classList.toggle('overdue', !!task.date && !task.done && task.date < todayStr());
      scheduleSave();
    });
    li.querySelector('.task-text').addEventListener('input', e=>{ task.text = e.target.textContent; scheduleSave(); });
    const dateInput = li.querySelector('.task-date');
    if(dateInput){
      dateInput.addEventListener('change', e=>{
        task.date = e.target.value;
        e.target.classList.toggle('overdue', !!task.date && !task.done && task.date < todayStr());
        scheduleSave();
      });
    }
    const assigneeEl = li.querySelector('.task-assignee');
    if(assigneeEl){
      assigneeEl.addEventListener('change', e=>{
        const targetIdx = parseInt(e.target.value, 10);
        if(targetIdx === selfIdx) return;
        const [moved] = t.tasks.splice(tIdx, 1);
        if(!Array.isArray(p.team[targetIdx].tasks)) p.team[targetIdx].tasks = [];
        p.team[targetIdx].tasks.push(moved);
        render(); scheduleSave();
      });
    }
    const recurToggle = li.querySelector('.task-recur-toggle');
    const flipRecurring = ()=>{ task.recurring = !task.recurring; render(); scheduleSave(); };
    recurToggle.addEventListener('click', flipRecurring);
    const recurLabel = li.querySelector('.task-recur-label');
    if(recurLabel) recurLabel.addEventListener('click', flipRecurring);
    li.querySelector('.task-rm').onclick = ()=>{ t.tasks.splice(tIdx,1); render(); scheduleSave(); };
    ul.appendChild(li);
  });
  container.appendChild(ul);
  const add = document.createElement('div');
  add.className = 'task-add';
  add.textContent = '+ add task';
  add.onclick = ()=>{ t.tasks.push({ text:'', done:false, date:'', recurring:false, completedAt:'' }); render(); scheduleSave(); };
  container.appendChild(add);
  return container;
}

function renderSidebarOnly(){
  const app = document.getElementById('app');
  const old = app.querySelector('.sidebar');
  const fresh = renderSidebar();
  app.replaceChild(fresh, old);
}

function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

</script>
</body>
</html>
